services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexus_lore
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_lore"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://nexus:nexus_pass@db:5432/nexus_lore
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_ENDPOINT: ${DOCKER_AI_ENDPOINT:-http://host.docker.internal:11434}
      AI_MODEL: ${AI_MODEL:-llama3}
      CORS_ORIGINS: '["http://localhost:3000"]'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        NUXT_API_PROXY: http://backend:8000/api/**
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
